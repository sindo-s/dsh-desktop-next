[package]
name = "dsh-desktop-next"
version = "0.4.0-alpha.4"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "=2.11.5", features = ["unstable"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[dev-dependencies]
minisign-verify = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
